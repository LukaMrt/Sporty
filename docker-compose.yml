services:
  # ---------------------------------------------------------------------------
  # Service app : AdonisJS + React (Vite build intégré)
  # Pour le développement quotidien, préférer :
  #   docker compose up db    (PostgreSQL seul)
  #   node ace serve --hmr    (AdonisJS avec hot reload)
  # ---------------------------------------------------------------------------
  app:
    build: .
    ports:
      - '${PORT:-3333}:${PORT:-3333}'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    environment:
      # Dans Docker, l'app accède à PostgreSQL via le nom du service (pas localhost)
      DB_HOST: db
      HOST: 0.0.0.0
      STORAGE_PATH: /app/storage
    volumes:
      # Fichiers GPX : doivent survivre aux reconstructions de l'image
      - appstorage:/app/storage
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:$${PORT:-3333}/health > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Service db : PostgreSQL 18
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-sporty}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sporty}
      POSTGRES_DB: ${DB_DATABASE:-sporty}
    # Port exposé sur l'hôte pour le développement local uniquement :
    # à retirer dans un déploiement de production.
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      # Postgres 18 : les données vivent dans /var/lib/postgresql/<version>/docker
      - pgdata:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-sporty} -d ${DB_DATABASE:-sporty}']
      interval: 5s
      timeout: 5s
      retries: 5

# Volume nommé pour la persistance des données PostgreSQL (NFR15)
volumes:
  pgdata:
  appstorage:
